<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css"  media="screen">
  <title>Todo App</title>
</head>
<body class="body">
  <aside>
    <h1 class="aside__title">Todo App</h1>
    <div class="aside">
      <img class="aside__img" src="./eisenhower-matrix.jpg" alt="eisenhower matrix">
      <a class="aside__a" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
  </aside>
  <main class="app">
    <section class="add-task">
      <label class="add-task__label" for="new-task">Add Item</label>
      <div class="add-task__wrapper">
      <input class="add-task__input" id="new-task" class="task" type="text">
      <button class="add-task__btn">Add</button>
      </div>
    </section>
    <section class="todo">
      <h3>Todo</h3>
      <ul class="todo__list" id="incompleteTasks">
        <li>
          <input class="todo__checkbox" type="checkbox">
          <label class="todo__task">Pay Bills</label>
          <input type="text" class="todo__task">
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" alt="remove">
          </button>
        </li>
        <li class="editMode">
          <input class="todo__checkbox" type="checkbox">
          <label class="todo__task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="todo__task">
          <button class="edit">Save</button>
          <button class="delete">
            <img src="./remove.svg" alt="remove">
          </button>
        </li>
      </ul>
    </section>
    <section class="completed">
      <h3>Completed</h3>
      <ul class="completed__list" id="completed-tasks">
        <li>
          <input class="completed__checkbox" type="checkbox" checked>
          <label class="completed__task">See the Doctor</label>
          <input type="text" class="completed__task">
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" alt="remove">
          </button>
        </li>
      </ul>
    </section>
  </main>
<script SRC="app.js"></script>  
</body>
</html>
